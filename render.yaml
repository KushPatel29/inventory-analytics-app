services:
  - type: web
    name: inventory-analytics-app
    runtime: docker
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DEMO_AUTOLOAD
        value: "1"
      - key: SESSION_COOKIE_SECURE
        value: "1"
