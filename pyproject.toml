[tool.black]
line-length = 100
target-version = ["py310", "py311"]
extend-exclude = [
  "venv",
  ".venv",
  "build",
  "dist",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # isort
  "UP", # pyupgrade
]
ignore = [
  "E203",  # whitespace before ':' (black compatibility)
]
exclude = [
  "venv",
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["invapp"]
combine-as-imports = true

