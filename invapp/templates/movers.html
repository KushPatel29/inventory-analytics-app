{% extends 'base.html' %}
{% block content %}
  <div class="grid grid-cols-1 gap-6">
    <div class="bg-white p-6 rounded-lg shadow">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-semibold">Movers</h2>
        <div class="flex items-center gap-2 text-sm">
          <label>Quantile
            <input id="mv-q" type="number" min="0.1" max="0.9" step="0.05" value="0.5" class="border rounded p-1 w-24" />
          </label>
          <button id="mv-apply" class="px-3 py-1 bg-indigo-600 text-white rounded">Apply</button>
        </div>
      </div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="font-semibold mb-2">Top Usage</h3>
        <div id="mv-top-usage" class="w-full h-96"></div>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <h3 class="font-semibold mb-2">Top Weeks On Hand</h3>
        <div id="mv-top-woh" class="w-full h-96"></div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-lg shadow">
      <h3 class="font-semibold mb-2">Supplier vs Movement Class</h3>
      <div id="mv-heatmap" class="w-full h-96"></div>
    </div>
  </div>

  <script type="module">
    import { initMovers } from "{{ url_for('static', filename='js/movers.js') }}";
    initMovers();
  </script>
{% endblock %}
