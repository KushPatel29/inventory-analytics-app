{% extends 'base.html' %}
{% block content %}
  <div class="grid grid-cols-1 gap-6">
    <div class="bg-white p-6 rounded-lg shadow">
      <h2 class="text-lg font-semibold mb-4">FZ ↔ EXT Move Calculators</h2>
      <p class="text-sm text-gray-600">Set desired Weeks On Hand and generate move lists with downloadable Excel.</p>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded-lg shadow">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Move FZ → EXT</h3>
          <label class="flex items-center gap-2 text-sm">
            Desired EXT WOH: <input id="fz2ext-thr" type="range" min="0" max="8" step="0.25" value="1" />
            <span id="fz2ext-val">1.0</span>
          </label>
        </div>
        <div id="fz2ext-table" class="w-full"></div>
        <div class="mt-2 text-sm">
          <a id="fz2ext-dl" class="px-3 py-1 border rounded hover:bg-gray-50" href="#">Download Excel</a>
        </div>
      </div>
      <div class="bg-white p-6 rounded-lg shadow">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold">Move EXT → FZ</h3>
          <label class="flex items-center gap-2 text-sm">
            Desired FZ WOH: <input id="ext2fz-thr" type="range" min="0" max="8" step="0.25" value="1" />
            <span id="ext2fz-val">1.0</span>
          </label>
        </div>
        <div id="ext2fz-table" class="w-full"></div>
        <div class="mt-2 text-sm">
          <a id="ext2fz-dl" class="px-3 py-1 border rounded hover:bg-gray-50" href="#">Download Excel</a>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initMoves } from "{{ url_for('static', filename='js/moves.js') }}";
    initMoves();
  </script>
{% endblock %}
